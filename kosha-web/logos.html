<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kosha - Logo Fetcher</title>
    <link rel="icon" type="image/png" href="assets/kosha.png">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            text-align: center;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: var(--surface-dark);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
        }

        .brand-logo {
            width: 150px;
            margin-bottom: 20px;
            mix-blend-mode: screen;
        }

        h1 {
            color: var(--primary);
            margin-bottom: 10px;
        }

        p {
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 14px;
            line-height: 1.5;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: var(--bg-dark);
            color: var(--text-main);
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        input:focus {
            border-color: var(--primary);
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            background: var(--primary);
            color: #000;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background: var(--secondary);
        }

        #result {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        #logo-preview {
            width: 128px;
            height: 128px;
            border-radius: 12px;
            object-fit: contain;
            background: #fff;
            padding: 10px;
        }

        .nav-link {
            display: inline-block;
            margin-top: 30px;
            color: var(--primary);
            text-decoration: none;
            font-size: 14px;
        }

        .nav-link:hover {
            text-decoration: underline;
        }

        .footer-info {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
            font-size: 0.8rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="assets/kosha_with_name.png" alt="Kosha" class="brand-logo">
        <h1>Brand Logo Fetcher</h1>
        <p>Type a website domain to download its high-resolution logo. You can then import this logo directly into your Kosha app as a Custom Icon.</p>
        
        <div class="input-group">
            <input type="text" id="domainInput" placeholder="e.g. netflix.com or openai.com" onkeypress="handleEnter(event)">
            <button onclick="fetchLogo()">Search</button>
        </div>

        <div id="result">
            <img id="logo-preview" src="" alt="Logo Preview">
            <button id="downloadBtn" onclick="downloadLogo()">Download Logo</button>
        </div>

        <a href="index.html" class="nav-link">&larr; Back to Kosha Home</a>

        <div class="footer-info">
            <p style="margin-bottom: 5px;">All trademarks and logos belong to their respective owners.</p>
            <p style="margin-bottom: 0;">&copy; 2026 Kosha. All rights reserved.</p>
        </div>
    </div>

    <script>
        let currentUrl = "";

        function handleEnter(e) {
            if (e.key === 'Enter') {
                fetchLogo();
            }
        }

        function fetchLogo() {
            let domain = document.getElementById('domainInput').value.trim();
            if (!domain) return;
            
            // Clean up protocol if user added it
            domain = domain.replace(/^https?:\/\//, '').replace(/\/.*$/, '');
            
            // Google's favicon API with sz=128 (high resolution)
            currentUrl = `https://www.google.com/s2/favicons?domain=${domain}&sz=128`;
            
            const preview = document.getElementById('logo-preview');
            preview.src = currentUrl;
            
            document.getElementById('result').style.display = 'flex';
        }

        async function downloadLogo() {
            if (!currentUrl) return;
            
            try {
                // Fetch the image as a Blob so we can force download
                const response = await fetch(currentUrl);
                const blob = await response.blob();
                
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                
                let domain = document.getElementById('domainInput').value.trim();
                domain = domain.replace(/^https?:\/\//, '').replace(/\/.*$/, '');
                a.download = `logo_${domain.split('.')[0]}.png`;
                
                document.body.appendChild(a);
                a.click();
                
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
            } catch (err) {
                // Fallback for CORS issues if they happen
                const a = document.createElement('a');
                a.href = currentUrl;
                a.target = "_blank";
                a.download = "logo.png";
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }
        }
    </script>
</body>
</html>
